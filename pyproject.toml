[project]
name = "ai-news-agent-routines"
version = "0.1.0"
requires-python = ">=3.11"
# Vercel's @vercel/python builder reads dependencies from this file
# rather than requirements.txt when both exist. Keep this list in sync
# with requirements.txt — both lists must match for local + Vercel parity.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "markdown",
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.pytest.ini_options]
# Project layout is flat (modules at repo root, no src/), so add the
# repo root to sys.path so `from dashboard import ...` resolves in tests.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
