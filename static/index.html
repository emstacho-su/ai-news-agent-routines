<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI News Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="crt">
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="brand">AI NEWS AGENT</h1>
    <div class="status">
      <a href="/custom" class="cell">custom</a>
      <span id="run-status" class="cell"></span>
    </div>
  </header>

  <main>
    <section class="actions">
      <span class="muted">Briefings stored: {{briefing_count}} &middot; daily routine fires at 12:00 UTC</span>
    </section>

    <section class="list-wrap">
      <h2 class="section-title">// BRIEFINGS</h2>
      {{briefings_list}}
    </section>
  </main>

  <footer class="bottombar">
    <span class="muted">v1-routines &middot; data on the GitHub data branch</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
