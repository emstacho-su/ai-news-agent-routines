<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | AI News Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="crt">
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="brand"><a href="/">AI NEWS AGENT</a></h1>
    <div class="status">
      <a href="/" class="cell">briefings</a>
      <a href="/custom" class="cell">custom</a>
      <a href="/saved" class="cell">saved</a>
      <span id="budget-cell" class="cell">--</span>
    </div>
  </header>

  <main>
    <section class="actions">
      <h2 class="section-title" style="margin-top:0;">// PROFILE</h2>
    </section>

    <p class="muted" style="margin-bottom:14px;">
      Markdown. Prepended to the agent's system prompt every run.
      Edits take effect on the next briefing.
    </p>

    <form id="profile-form" class="profile-form">
      <textarea id="profile-content" class="profile-textarea" spellcheck="false">{{profile_content}}</textarea>
      <div class="actions" style="margin-top:14px;">
        <button id="profile-save" class="btn" type="submit">SAVE</button>
        <span id="profile-status" class="muted"></span>
      </div>
    </form>
  </main>

  <footer class="bottombar">
    <span class="muted">data/profile.md</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
