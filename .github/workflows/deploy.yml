name: deploy

# Tests on every push and PR.
# Production deploy is handled by the Vercel GitHub integration on push
# to main (configured at vercel.com); we don't need a deploy step here.
# Preview deploys land automatically on PRs and on dev pushes.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: pytest tests/ -v
